parameters:
  min_depth_mm:
    type: int
    values: [250]
  max_depth_mm:
    type: int
    values: [3000, 3500, 4000]
  depth_slice_mm:
    type: int
    values: [200, 250, 300, 400]
  min_area_px:
    type: int
    values: [500, 700, 900, 1200]
  infrared_canny_low:
    type: int
    values: [35, 45, 55]
  infrared_canny_high:
    type: int
    values: [110, 130, 150]
  split_boundary_px:
    type: int
    values: [2, 3, 5]
  stable_contour_min_anchors:
    type: int
    values: [8, 12, 16, 24]
  pcl_cluster_tolerance_mm:
    type: int
    values: [25, 35, 50, 70]
  pcl_sample_step_px:
    type: int
    values: [2, 3, 4]
  pcl_frame_interval:
    type: int
    values: [1, 2, 3]
  track_confirm_frames:
    type: int
    values: [2, 3, 4]
  track_miss_frames:
    type: int
    values: [3, 5, 8]
  track_smooth_percent:
    type: int
    values: [55, 65, 75]

run_modes:
  fast_pcl:
    args: ["--pcl-sample-step-px=4", "--pcl-frame-interval=3"]
  fine_pcl:
    args: ["--pcl-sample-step-px=2", "--pcl-frame-interval=1"]
  no_pcl:
    args: ["--no-pcl-clustering"]
  feature_light:
    args: ["--feature-profile=light"]
  feature_debug:
    args: ["--feature-profile=debug"]
